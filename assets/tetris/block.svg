<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Блок тетриса в оттенках серого: цвет фигуры задаёт оттенок плитки (tint) -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8b8b8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="8" fill="#202020"/>
  <polygon points="10,10 190,10 160,40 40,40" fill="#ffffff"/>
  <polygon points="10,10 40,40 40,160 10,190" fill="#e2e2e2"/>
  <polygon points="190,10 190,190 160,160 160,40" fill="#8a8a8a"/>
  <polygon points="10,190 40,160 160,160 190,190" fill="#6a6a6a"/>
  <rect x="40" y="40" width="120" height="120" fill="url(#face)"/>
  <polygon points="52,52 96,52 52,96" fill="#ffffff" fill-opacity="0.8"/>
</svg>
