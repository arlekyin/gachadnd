id: swamp_lights
title: Огоньки над трясиной
biome: swamp
image:
  src: assets/sketches/swamp-lights.webp
  w: 1024
  h: 718
  lights:
    - { x: 590, y: 428, r: 34 }
    - { x: 709, y: 354, r: 24 }
    - { x: 629, y: 316, r: 16 }
    - { x: 582, y: 298, r: 13 }
    - { x: 541, y: 291, r: 10 }
sketch: swampLights
caption: огоньки — не светлячки. к трясине не подходить
text:
  - Над чёрной водой висят огоньки — неподвижно, будто ждут. Камыш молчит, лягушек не слышно.
  - "Старые исследователи говорили: это навыки утонувших. Оболочки без хозяина — всё ещё ищут, на кого надеться."
  - Один огонёк медленно плывёт к нам.
options:
  - label: Протянуть руку огоньку
    detail: один из отряда · случайный зелёный навык сразу в Память, без кристалла · до долгого отдыха он шепчет — помеха на проверки Мудрости
    who: one
    text: Огонёк гаснет в ладони. В голове — чужой голос и чужая привычка.
    effects:
      - skill: { rarity: green }
      - note: "До долгого отдыха — помеха на проверки Мудрости у того, кто протянул руку: новый навык шепчет."
  - label: Пойти за огоньками вглубь
    detail: успех — тайник утонувших, заметная награда каждому · провал — трясина, каждый тратит Кость Хитов
    who: one
    check: { skill: sur, dc: 0 }
    success:
      text: Огоньки ведут от кочки к кочке — к полузатопленной лодке. В ней то, что утонувшие так и не донесли.
      effects:
        - reward: { tier: notable, count: 3 }
          to: all
    failure:
      text: Под ногами вместо кочки — пустота. Трясина отпускает не сразу.
      effects:
        - hit_dice: -1
          to: all
  - label: Обойти трясину стороной
    detail: ничего не случится
    who: none
    text: Огоньки провожают отряд взглядом. Один гаснет последним.
