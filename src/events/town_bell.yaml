id: town_bell
title: Колокол на площади
biome: town
caption: верёвка тёплая, будто её только что держали
text:
  - Посреди пустой площади — колокол на перекладине. Верёвка тёплая, будто её только что отпустили.
  - Говорят, его звон лечит. Говорят также, что его слышно очень далеко.
options:
  - label: Ударить в колокол
    detail: весь отряд лечится на половину максимума ПЗ · Пожиратель ближе
    who: all
    text: Звон прокатывается по городу и дальше, за стены, за туман. Раны затягиваются. Где-то далеко что-то поднимает голову.
    effects:
      - hp: 0.5
      - omen: 1
        to: none
  - label: Не трогать
    who: none
    text: Колокол молчит. Площадь — тоже.
