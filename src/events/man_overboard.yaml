id: man_overboard
title: Человек за бортом
biome: storm
caption: держится за обломок. долго не продержится
text:
  - Сквозь ливень видно — кто-то держится за обломок мачты. Волны выше головы.
  - Он кричит. Ветер забирает слова.
options:
  - label: Вытащить
    who: one
    check: { skill: ath, dc: 2 }
    success:
      text: Спасённый отдышался и отдал всё, что уцелело в карманах. «Я в долгу.»
      effects:
        - reward: { tier: notable, count: 3 }
    failure:
      text: Волна накрывает всех. Обломок уносит вместе с человеком.
      effects:
        - hp: -0.2
          to: all
  - label: Не рисковать
    who: none
    text: Крик ещё долго слышится в шуме шторма.
