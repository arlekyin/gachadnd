id: bone_trail
title: Тропа из костей
biome: swamp
caption: следы свежие. зверь крупный
text:
  - Тропу устилают обглоданные кости — лосиные, кабаньи и одна слишком похожая на человеческую.
  - Следы свежие, когти глубокие. Зверь где-то рядом и сыт. Пока.
options:
  - label: Выследить зверя
    detail: успех — бой на своих условиях и редкая награда победителям
    who: one
    check: { skill: sur, dc: 1 }
    success:
      text: Логово найдено раньше, чем зверь учуял отряд. Бой начнётся по вашей команде.
      effects:
        - fight: "Зверь болот у логова (элитный противник этажа). Отряд нападает первым: первый раунд — внезапность для врага. После победы — редкая награда (Награды события, Редкая)."
    failure:
      text: Зверь учуял отряд первым.
      effects:
        - fight: "Зверь болот нападает из засады (элитный противник этажа): первый раунд — внезапность для отряда."
  - label: Обойти стороной
    detail: долгий крюк по трясине — каждый тратит Кость Хитов
    who: all
    text: Крюк выходит долгим и мокрым.
    effects:
      - hit_dice: -1
