id: singing_reef
title: Поющий риф
biome: sea
caption: голос знакомый. не слушать
text:
  - Над рифом поют. Голос знакомый — кто-то из тех, кого вы оставили позади.
  - "Песня обещает: подплыви ближе, и всё вернётся."
options:
  - label: Слушать
    detail: бросает ведущий за всех · успех — редкая награда каждому · провал — каждый тратит Кость Хитов
    who: one
    check: { save: wis, dc: 1 }
    success:
      text: Песня обрывается на полуслове — и риф отдаёт то, что держал для поющего.
      effects:
        - reward: { tier: rare, count: 3 }
          to: all
    failure:
      text: Очнулись по пояс в воде, у самых камней.
      effects:
        - hit_dice: -1
          to: all
  - label: Заткнуть уши и грести
    who: none
    text: Песня смолкает за кормой. Голос — не сразу.
