id: sunken_altar
title: Затонувший Алтарь
biome: deep
caption: старый Алтарь Памяти. руны ещё светятся
text:
  - На дне — старый Алтарь Памяти, оплетённый водорослями. Руны всё ещё светятся.
  - Вода вокруг него тёплая. Говорят, он отдаёт — но берёт плату сам.
options:
  - label: Опустить руку в чашу
    detail: редкая награда · Алтарь заберёт случайный навык
    who: one
    text: Алтарь отвечает светом — и что-то из Памяти уходит в воду.
    effects:
      - reward: { tier: rare, count: 3 }
      - burn_skill: true
  - label: Не трогать
    who: none
    text: Руны гаснут одна за другой, когда отряд уходит.
