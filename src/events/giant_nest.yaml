id: giant_nest
title: Гнездо
biome: sky
caption: вместо яиц — кристаллы. хозяйка рядом
text:
  - На уступе — огромное гнездо. Вместо яиц в нём кристаллы, тёплые, как живые.
  - Над облаками кружит тень. Хозяйка гнезда недалеко.
options:
  - label: Взять кристалл
    detail: фиолетовый кристалл · хозяйка вернётся — бой
    who: one
    text: Кристалл в руке. Сверху — крик, от которого закладывает уши.
    effects:
      - crystal: { rarity: purple }
      - fight: "Хозяйка гнезда (элитный противник этажа) пикирует сверху — бой на уступе."
  - label: Взять перо
    detail: малая награда
    who: one
    text: Перо длиной в руку — и лёгкое, как воздух.
    effects:
      - reward: { tier: small, count: 3 }
  - label: Уйти тихо
    who: none
    text: Тень над облаками делает ещё один круг — и не замечает.
