id: hungry_stump
title: Пень, который просит
biome: swamp
caption: «дай» — шепчет из дупла
text:
  - Старый пень, обросший грибами. Из дупла тянет теплом, и оттуда шепчут — тихо, настойчиво, одно слово.
  - «Дай.»
  - Рядом в мху поблёскивают осколки чужих кристаллов. Пень не всегда честен.
options:
  - label: Отдать кристалл и поторговаться
    detail: самый дешёвый кристалл из сумки · успех — кристалл на редкость выше · провал — пень просто съест
    who: one
    check: { skill: per, dc: 1 }
    success:
      text: Пень довольно урчит и выплёвывает другой кристалл — ярче прежнего.
      effects:
        - take_crystal: true
        - crystal: { rarity: up }
    failure:
      text: Дупло захлопывается. Кристалла нет, ответа тоже.
      effects:
        - take_crystal: true
  - label: Отказать
    who: none
    text: «Дай…» — ещё долго слышно за спиной.
