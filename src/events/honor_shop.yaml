id: honor_shop
title: Лавка без продавца
biome: town
caption: «бери, что нужно. оставь, что не жалко»
text:
  - Дверь лавки открыта, за прилавком никого. На полках — склянки, бинты, свёртки. Пыли нет.
  - На табличке аккуратным почерком — «бери, что нужно, оставь, что не жалко».
options:
  - label: Оставить кристалл и взять своё
    detail: отдать самый дешёвый кристалл · малая награда на выбор
    who: one
    text: Кристалл исчезает с прилавка, стоит отвернуться. Табличка будто улыбается.
    effects:
      - take_crystal: true
      - reward: { tier: small, count: 3 }
  - label: Взять даром
    detail: заметная награда · но лавка запомнит
    who: one
    text: Ничего не случилось. Пока.
    effects:
      - reward: { tier: notable, count: 3 }
      - note: "Взявший даром: первый бой этого этажа он начинает с помехой на бросок инициативы — у лавки долгая память."
  - label: Ничего не трогать
    who: none
    text: Дверь сама закрывается за спиной.
