id: dark_lighthouse
title: Маяк без смотрителя
biome: storm
caption: фонарь цел. смотрителя нет
text:
  - На скале — маяк. Фонарь цел, смотрителя нет, дверь бьётся на ветру.
  - Наверху, у линзы, — запасы масла и фитили. Зажечь его — дело ловкости.
options:
  - label: Зажечь маяк
    detail: успех — каждому заметная награда
    who: one
    check: { ability: dex, dc: 0 }
    success:
      text: Луч пробивает шторм. Где-то в тумане мигает ответный огонь — и к подножию маяка выносит груз.
      effects:
        - reward: { tier: notable, count: 3 }
          to: all
    failure:
      text: Масло вспыхивает раньше времени. Обожжённые пальцы и ни одного луча.
      effects:
        - hp: -0.2
  - label: Переждать шторм внизу
    detail: каждый восстанавливает четверть ПЗ
    who: all
    text: Стены маяка держат ветер. Можно перевести дух.
    effects:
      - hp: 0.25
