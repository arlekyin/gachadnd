id: angler_light
title: Свет удильщика
biome: deep
caption: свет — на удочке. держит кто-то
text:
  - В темноте покачивается огонёк — тёплый, манящий. Слишком ровный для живого света.
  - Под ним — длинная тень удочки. Кто-то её держит.
options:
  - label: Пойти на свет
    detail: бой с хозяином удочки
    who: none
    text: Свет гаснет, стоит подойти. Из темноты поднимается то, что его держало.
    effects:
      - fight: "Удильщик глубин (элитный противник этажа) — нападает из темноты. После победы его фонарь — заметная награда каждому (Награды события, Заметная)."
  - label: Отпугнуть
    who: one
    check: { skill: itm, dc: 1 }
    success:
      text: Огонёк дёргается и уплывает. Удочку бросили — и её фонарь остался.
      effects:
        - crystal: { rarity: green }
    failure:
      text: Огонёк гаснет, а из темноты щёлкают челюсти.
      effects:
        - hp: -0.2
  - label: Пустить приманку дальше
    detail: свет уводит Пожирателя в сторону — предвестие отступает
    who: none
    text: Огонёк уплывает в глубину — и что-то большое идёт за ним, мимо отряда.
    effects:
      - omen: -1
