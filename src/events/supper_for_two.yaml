id: supper_for_two
title: Ужин на двоих
biome: town
caption: в одном окне свет. стол накрыт
text:
  - Весь город тёмный, кроме одного окна. Внутри накрыт стол на двоих, суп ещё дымится.
  - Хозяев нет. На спинке стула — чужой плащ, на тарелке — ни крошки.
options:
  - label: Сесть за стол
    detail: каждый возвращает Кость Хитов
    who: all
    text: Горячая еда — лучшее, что случалось за этаж. Никто так и не пришёл.
    effects:
      - hit_dice: 1
  - label: Дождаться хозяев
    who: one
    check: { skill: ins, dc: 0 }
    success:
      text: Хозяева так и не приходят, но по вещам видно, кто здесь жил и почему ушёл. Под половицей — их сбережения.
      effects:
        - reward: { tier: small, count: 3 }
        - note: "Дом принадлежал двум исследователям прошлого отряда — расскажите о них то, что пригодится дальше (зацепка к узлу или жильцу Якоря)."
    failure:
      text: Ожидание затягивается. Свеча гаснет, и становится понятно — никто не придёт.
  - label: Уйти
    who: none
    text: Свет в окне гаснет, стоит отойти на десять шагов.
