id: diving_bell
title: Колокол водолаза
biome: deep
caption: воздуха — на несколько вдохов
text:
  - На дне лежит водолазный колокол. Внутри ещё держится пузырь воздуха — и что-то блестит у стенки.
  - Воздуха — на несколько вдохов.
options:
  - label: Задержать дыхание и достать
    who: one
    check: { ability: con, dc: 1 }
    success:
      text: Пальцы смыкаются на холодном кристалле.
      effects:
        - crystal: { rarity: blue }
    failure:
      text: Лёгкие горят. Наверх — ни с чем.
      effects:
        - hp: -0.25
  - label: Подниматься
    who: none
    text: Колокол остаётся ждать следующих.
