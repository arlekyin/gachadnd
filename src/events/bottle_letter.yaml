id: bottle_letter
title: Письмо в бутылке
biome: sea
caption: координаты размыты, но читаются
text:
  - Волна выносит к ногам бутылку с письмом. Почерк торопливый, координаты размыты.
  - «…оставили всё на острове с одиноким деревом. Если читаешь — забирай, нам уже не нужно.»
options:
  - label: Доплыть до острова
    who: one
    check: { skill: ath, dc: 1 }
    success:
      text: Под одиноким деревом — ящик, обмотанный цепью. Внутри кристалл.
      effects:
        - crystal: { rarity: blue }
    failure:
      text: Течение сильнее, чем казалось. До острова — никак, назад — с трудом.
      effects:
        - hp: -0.25
  - label: Продать координаты пиратам
    detail: золото — четверть Базы этажа
    who: one
    text: Пираты платят не торгуясь. Слишком охотно.
    effects:
      - gold: 0.25
