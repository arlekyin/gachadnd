id: cloud_bridge
title: Облачный мост
biome: sky
caption: облако держит. наверное
text:
  - Между островами — мост из облака. Выглядит плотным. Выглядит.
  - На той стороне — короткий путь вверх.
options:
  - label: Шагнуть
    who: one
    check: { skill: acr, dc: 1 }
    success:
      text: Облако держит. Путь короче на целый остров.
      effects:
        - note: "Облачный мост: отряд срезает путь — может перейти на любой узел следующего ряда, а не только по линиям."
    failure:
      text: Облако расходится под ногой. Падение на нижний остров.
      effects:
        - hp: -0.3
  - label: Обойти по краю
    who: none
    text: Долго, но надёжно.
