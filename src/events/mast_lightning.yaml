id: mast_lightning
title: Молния в мачту
biome: storm
caption: разряд можно поймать навыком
text:
  - Молния бьёт в мачту, и разряд гуляет по мокрым канатам. Навыки в Памяти отзываются гулом.
  - Говорят, разряд может вычистить перегрев. Говорят также, что иногда он выжигает навык целиком.
options:
  - label: Подставить навыки под разряд
    detail: снять перегрев всех навыков · провал — сгорает случайный навык
    who: one
    check: { save: con, dc: 1 }
    success:
      text: Разряд проходит насквозь. Навыки остыли — все до одного.
      effects:
        - cool: true
    failure:
      text: Перегрев ушёл — и один навык вместе с ним.
      effects:
        - cool: true
        - burn_skill: true
  - label: Укрыться
    who: none
    text: Мачта горит до утра. Отряд — нет.
