id: moon_observatory
title: Обсерватория на краю
biome: sky
caption: телескоп смотрит на луну. не смотреть
text:
  - На краю острова — обсерватория. Телескоп направлен на луну, окуляр ещё тёплый.
  - "На двери выцарапано: «не смотри»."
options:
  - label: Посмотреть
    detail: спасбросок Мудрости, чтобы отвести взгляд · успех — лоты следующей Сделки луны · провал — метка луны
    who: one
    check: { save: wis, dc: 2 }
    success:
      text: В окуляре — обратная сторона луны и то, что она приготовила отряду. Взгляд удаётся отвести.
      effects:
        - deal_preview: true
    failure:
      text: Взгляд не отвести. Луна смотрит в ответ — и запоминает.
      effects:
        - deal_preview: true
        - moon_mark: true
        - note: "Метка луны: персонаж отмечен (флаг moonMark). Разыграйте последствия позже — см. лор Предела."
  - label: Закрыть телескоп
    who: none
    text: Крышка окуляра щёлкает. На миг кажется, что из-за неё кто-то вздохнул.
