id: white_flag
title: Шлюпка с белым флагом
biome: sea
caption: торгуют навыками. навык выбирают сами
text:
  - К берегу подходит шлюпка под белым флагом. Пираты вежливы и улыбаются слишком широко.
  - «Покупаем навыки. Платим щедро. Какой — выбираем сами, такие правила.»
options:
  - label: Продать навык
    detail: пираты забирают случайный навык из Памяти · платят по редкости
    who: one
    text: Сделка скреплена рукопожатием. В голове становится тише — и пусто в одном месте.
    effects:
      - take_skill: { pay: 0.35 }
  - label: Отказаться
    who: none
    text: «Как знаете.» Шлюпка отваливает. Улыбки — нет.
