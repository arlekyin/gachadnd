id: hunters_tower
title: Вышка охотников
biome: swamp
caption: чей рюкзак? лестница гнилая
text:
  - Над осокой торчит охотничья вышка. Лестница прогнила через ступеньку, на самом верху на верёвке покачивается рюкзак.
  - Ворон на перилах смотрит так, будто знает, чем кончилась прошлая попытка.
options:
  - label: Залезть за рюкзаком
    who: one
    check: { skill: ath, dc: 0 }
    success:
      text: В рюкзаке — дневник прошлого отряда и кристалл, завёрнутый в тряпицу.
      effects:
        - crystal: { rarity: blue }
    failure:
      text: Ступенька уходит из-под ноги. Падение короткое, но жёсткое.
      effects:
        - hp: -0.25
  - label: Срезать верёвку снизу
    detail: что-то разобьётся, что-то уцелеет
    who: one
    text: Рюкзак шлёпается в грязь. Кое-что уцелело.
    effects:
      - reward: { tier: small, count: 3 }
  - label: Не трогать чужое
    who: none
    text: Ворон каркает вслед. Похоже, с облегчением.
