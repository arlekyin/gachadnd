# Стаи встреч на боевых узлах (scripts/labyrinth/encounters.js). Сборка (npm run build) кладёт их в компендиум
# «Gacha: Таблицы встреч»: по таблице на стаю, название — «Встречи: <биом>: <стая>»; строки — монстры SRD dnd5e.
#
# Биомы — ключи scripts/labyrinth/biomes.js (swamp — Лес и болота, town — Город в глуши).
# Монстр: name — английское имя в SRD (originalName), srd — id в компендиуме dnd5e.monsters,
# weight — как часто встаёт рядовым (вожака модуль берёт по силе), img — картинка строки. Мастер правит копию таблицы в мире.

