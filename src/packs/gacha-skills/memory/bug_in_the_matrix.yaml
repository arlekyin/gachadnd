description: |-
  Действием выберите навык серой, зелёной или синей редкости в вашей Памяти. Мастер создаёт в вашем инвентаре его кристалл-копию.

  Копия считается повторным кристаллом: на Привале её можно слить с навыком, чтобы повысить ранг. Если копия не использована до долгого отдыха, она исчезает.
activation: action
recovery: long
