id: GfK9HR0aBO9d1nIf
name: Кто я? Я [Title card]
rarity: red
tags:
  - память
  - аномалия
description: |-
  Действием примите облик существа, которое видите, до начала вашего следующего хода. Вы становитесь его копией с полными ресурсами и сразу получаете новое действие и бонусное действие.
  Урон по копии с учётом её сопротивлений переходит вашей исходной форме. Концентрация копии заканчивается вместе с обликом.

  В облике персонажа вы можете использовать его активные навыки из Памяти и активные способности его синергий — за цену чужой памяти.

  Существо с легендарным сопротивлением скопировать нельзя: вместо этого оно получает {damage}.
drawback: |-
  Цена чужой памяти — после навыка цели урон по его редкости: серый [[/damage 2d8 psychic]] · зелёный [[/damage 3d8 psychic]] · синий [[/damage 4d8 psychic]] · фиолетовый [[/damage 5d8 psychic]] · красный [[/damage 6d8 psychic]].
  Кроме того: синий — помеха на спасброски Мудрости до конца вашего следующего хода; фиолетовый — спасбросок Мудрости Сл 15, при провале вы теряете следующий ход; красный — один ваш экипированный навык (выбирает Мастер) не действует до долгого отдыха.
  Способность синергии: ступень II — 1 Кость Хитов и [[/damage 2d8 psychic]], ступень III — 2 Кости Хитов и [[/damage 4d8 psychic]].
activation: action
uses: 1
recovery: long
range: 60
damage:
  - formula: 10d8
    type: psychic
