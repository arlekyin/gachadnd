description: Когда вы бросаете инициативу, вы можете сделать ставку. Мастер снимает все ваши экипированные навыки и экипирует вместо них столько же случайных навыков из вашей Памяти. До конца боя урон и лечение этих навыков увеличены на ваш бонус мастерства. После боя вы можете вернуть прежний набор.
