description: |-
  В любой момент объявите, что вы подготовились к этому заранее, — и сыграйте короткое воспоминание о том, как это было.

  Простая подготовка («я взял с собой верёвку») — бесплатно. Сложная («вчера я подкупил стражника») — 1 Кость Хитов и проверка подходящей характеристики. Невероятная («неделю назад я заминировал этот мост») — 2 Кости Хитов и проверка с помехой.

  Правдоподобна ли подготовка, какова сложность проверки и что из этого вышло — решает Мастер.
