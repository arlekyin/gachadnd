description: |-
  Бонусным действием сделайте снимок: запоминаются места и ПЗ всех существ в пределах 30 футов от вас — всех, кто в кадре. Снимок хранится до конца боя.

  Один раз, бонусным действием в свой ход, проявите снимок. Все существа из кадра, ещё живые, мгновенно возвращаются на свои места со снимка; если место занято — в ближайшее свободное. Ваши ПЗ становятся такими, как на снимке. ПЗ остальных, состояния и потраченные ресурсы не меняются.
activation: bonus
