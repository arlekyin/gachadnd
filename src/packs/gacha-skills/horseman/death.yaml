id: 9U6cE1w8fKkD7Db5
name: Смерть
rarity: orange
horseman: death
description: Только отнимая. Вы не восстанавливаете ПЗ ни отдыхом, ни Костями Хитов, ни зельями, ни заклинаниями. Когда вы опускаете существо до 0 ПЗ, вы восстанавливаете количество ПЗ, равное вашему уровню. Временные ПЗ вы получаете как обычно.
cleanse: Нанесите последний удар боссу этажа. Сращивание подтверждает Мастер в Терминале Тумана.
cleansed:
  name: Бледный конь
  description: |-
    Когда вы опускаете существо до 0 ПЗ, вы восстанавливаете количество ПЗ, равное вашему уровню. Прочее лечение снова действует на вас.

    Обычный враг, убитый вами, встаёт на вашей стороне до конца боя с половиной своего максимума ПЗ. Одновременно таких слуг может быть не больше вашего бонуса мастерства.

    Раз в долгий отдых, когда союзник умирает, вы можете отказать Смерти: союзник встаёт с половиной максимума ПЗ, а его убийца получает некротический урон, равный урону последнего удара.
