id: WSq08tbpM1XwcAwk
name: Голод
rarity: orange
horseman: hunger
description: |-
  Голод не терпит соседей. Когда вы берёте этот кристалл, все неэкипированные навыки в вашей Памяти сгорают.

  Голод нужно кормить. Вместо поглощения в Память вы можете скормить кристалл Голоду — в том числе повторный.
drawback: Если с прошлого долгого отдыха вы не скормили Голоду ни одного кристалла, после долгого отдыха он пожирает случайный экипированный навык.
cleanse: Скормите Голоду 10 кристаллов.
cleanse_goal: 10
cleansed:
  name: Ненасытность
  description: Когда вы опускаете существо до 0 ПЗ, вы можете пожрать его — тело исчезает. Вы получаете временные ПЗ, равные максимуму ПЗ этого существа, и одно его умение по выбору Мастера до конца боя. Боссов пожрать нельзя, но умение они отдают.
