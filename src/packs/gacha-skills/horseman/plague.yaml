id: kcxzfIQl6ZorkAwW
name: Чума
rarity: orange
horseman: plague
description: Вы — переносчик. В конце каждого вашего хода чума перескакивает на ближайшее к вам существо в пределах 10 футов — оно становится Отравленным до конца своего следующего хода.
drawback: Если врагов в пределах 10 футов нет, чума перескакивает на союзника.
cleanse: Заразите врагов 20 раз. Заражения отмечает Мастер в Терминале Тумана.
cleanse_goal: 20
cleansed:
  name: Пандемия
  description: |-
    Состояния, которые вы накладываете на врагов, заразны: в начале хода заражённого врага состояние переходит на всех врагов в пределах 10 футов от него.

    Состояния, наложенные на вас, при вашем попадании по врагу переходят на него и снимаются с вас.

    Положительные эффекты, наложенные на вас (заклинания, умения, зелья, навыки), заразны: в момент наложения их получают и все союзники в пределах 10 футов от вас. Копии действуют столько же, сколько оригинал, и заканчиваются вместе с ним. Если оригинал требует концентрации, копии держатся на той же концентрации заклинателя.
