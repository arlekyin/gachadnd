description: Война требует крови. Серию боевых узлов модуль считает по карте этажа.
drawback: Когда отряд выбирает узел без боя (Событие, Магазин, Привал, Погибель), вы теряете количество ПЗ, равное вашему уровню, и не получаете на этом узле никаких благ — ни короткого отдыха, ни покупок, ни слияния.
cleanse: Пройдите подряд 4 боевых узла (Монстры, Элита, Босс).
cleanse_goal: 4
cleansed:
  name: Всадник Войны
  description: |-
    Первый удар. Каждый бой начинается с раунда, в котором действует только ваш отряд.

    Боевой счёт. Каждое убийство, совершённое любым союзником, даёт всему отряду +1 к броскам атаки и урона до конца боя, максимум — ваш бонус мастерства. Считается автоматически.

    Кровавая баня. За каждый боевой узел подряд члены отряда получают +1 к своим спасброскам, максимум — ваш бонус мастерства. Узел без боя сбрасывает серию. Считается автоматически.
