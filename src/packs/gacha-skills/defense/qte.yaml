description: |-
  Когда атака попадает по вам, у вас на экране на мгновение появляются стрелки — нажмите их по порядку (на клавиатуре или мышью), пока не кончилось время.

  Успели — атака считается брошенной с помехой: бросается второй d20, берётся меньший. Если теперь она промахивается, урона нет; если попадает и так — урон вдвое меньше. Ошиблись или не успели — атака остаётся как была.

  Заряд тратится при каждой попытке. Навык срабатывает сам, пока он экипирован и есть заряды.
activation: reaction
