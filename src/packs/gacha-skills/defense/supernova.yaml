description: |-
  Пока навык экипирован, весь урон, который вы получаете в бою, копится в нём — не больше вашего максимума ПЗ. Накопленное сбрасывается в конце боя.

  Действием выпустите накопленное: каждое существо в 20 футах от вас, кроме вас, совершает спасбросок Ловкости против универсальной Сложности и получает урон Силовым полем, равный накопленному, при успехе — половину. Накопление обнуляется.
drawback: После взрыва вы ошеломлены до конца своего следующего хода.
