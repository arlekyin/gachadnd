description: |-
  Бонусным действием раздвойтесь: в свободной клетке в пределах 30 футов появляется вторая ваша копия. До начала вашего следующего хода вы в обоих местах сразу, и никто не знает, где вы на самом деле. Двигать в свой ход можно любую из копий.

  Когда по вам приходится урон, бросьте монетку. Орёл — попали по настоящему: урон проходит, вторая копия исчезает. Решка — по пустышке: урон уходит в никуда, исчезает та копия, по которой попали.

  Любое ваше действие — наблюдение: вы действуете из выбранной копии, она настоящая, вторая исчезает. Если до начала вашего следующего хода суперпозиция не схлопнулась, вы сами выбираете, где вы на самом деле.
