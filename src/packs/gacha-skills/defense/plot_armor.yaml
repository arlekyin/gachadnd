description: Главного героя не убивают во втором акте. Когда по вам попадает атака или вы проваливаете спасбросок, реакцией перепишите момент — атака промахивается, а спасбросок считается успешным.
drawback: За каждое использование Мастер получает жетон сюжетного поворота и может потратить его на этом этаже на осложнение — подкрепление врагов, ловушку, предательство или смену условий боя.
