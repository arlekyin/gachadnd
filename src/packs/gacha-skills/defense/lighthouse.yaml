description: |-
  Бонусным действием поставьте маяк в свободную клетку в пределах 30 футов. Маяк стоит 1 минуту или до конца боя. Его луч — конус 30 футов в выбранную сторону; в начале каждого раунда луч поворачивается на 90° по часовой стрелке.

  Союзник, начинающий ход в луче, до конца хода добавляет 1d4 к броскам атаки и спасброскам. Враг, начинающий ход в луче, совершает спасбросок Телосложения; провал — Ослеплён до конца своего хода.

  Враг рядом с маяком может действием разбить его.
