description: |-
  Действием сверните иглы. До конца вашего следующего хода вы получаете сопротивление всему урону. Каждое существо по вашему выбору в пределах 10 футов совершает спасбросок Мудрости против универсальной Сложности (8 + бонус мастерства + наивысший модификатор). При провале до конца вашего следующего хода оно совершает с помехой атаки по любым целям, кроме вас.

  Существо, попавшее по вам рукопашной атакой, пока действуют иглы, получает колющий урон, равный половине урона, полученного вами от этой атаки.
drawback: Ваш следующий ход пропадает — вы не можете совершать действия, бонусные действия и перемещаться.
