description: |-
  Каждое ваше попадание оружием нагревает его на 1, до 4. Пока клинок горячий, атаки оружием наносят дополнительный урон огнём, равный нагреву. Нагрев 4 — клинок плавится в руке: вы получаете 2d6 урона огнём, нагрев падает до 0.

  Бонусным действием стравите жар: каждое существо в 15-футовом конусе совершает спасбросок Ловкости и получает 1d6 урона огнём за каждую единицу нагрева, при успехе — половину. Нагрев падает до 0.
