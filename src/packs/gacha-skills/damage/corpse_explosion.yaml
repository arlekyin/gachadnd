description: |-
  Бонусным действием взорвите труп в пределах 60 футов. Каждое существо в 10 футах от него совершает спасбросок Ловкости и получает урон огнём, равный четверти максимума ПЗ погибшего, при успехе — половину. Труп исчезает.

  Если взрыв кого-то убил, его труп можно взорвать сразу же, без заряда и действия.
