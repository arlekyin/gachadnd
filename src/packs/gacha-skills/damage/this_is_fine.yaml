description: |-
  Действием подожгите свободную клетку в пределах 30 футов. Пожар горит 1 минуту или до конца боя. В начале каждого раунда огонь перекидывается на соседние по стороне клетки — но не сквозь стены и не дальше 30 футов от первой клетки.

  Существо, которое начинает ход в горящей клетке или впервые за ход заходит в неё, получает {damage}.

  Вы огня не замечаете: урон от этого пожара вам не страшен, а начиная ход в горящей клетке, вы получаете временные ПЗ, равные бонусу мастерства.
