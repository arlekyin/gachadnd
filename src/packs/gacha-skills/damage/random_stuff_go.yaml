description: |-
  Бонусным действием швырните в бой всё, что носите с собой. Выберите до [бонус мастерства] предметов оружия из инвентаря — не экипированных — и цели в пределах 60 футов. Каждый предмет — отдельная дальнобойная атака с его уроном; владение не нужно, бонус атаки — ваш бонус мастерства и модификатор Силы или Ловкости.

  Брошенное оружие остаётся лежать у цели — его можно подобрать кнопкой в карточке.
drawback: Что не подобрали до конца боя, пропадает навсегда.
