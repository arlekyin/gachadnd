description: |-
  Действием материализуйте в руках Ямато и нанесите один вертикальный разрез — линию длиной 300 футов и шириной 5 футов от вас. Каждое существо на линии получает {damage}. Предметы и стены на линии, которые никто не держит, рассекаются.

  Разрез режет само пространство: на линии остаётся трещина в ткани узла до конца сцены. Отряд может уйти через неё в Предел — покинуть узел, не завершив его, в том числе посреди боя, и выйти на соседний узел карты по выбору Мастера.
drawback: Трещина на границе этажа не затягивается и пахнет вероятностью — до конца этажа Запах отряда для Пожирателя выше на 5.
