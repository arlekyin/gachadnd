description: |-
  Связка синергий: включается сама, пока у вас экипировано не меньше 2 навыков огня и 2 навыков яда. Кристаллом не выпадает.

  Действием — облако горящего яда радиусом 10 футов в точке в пределах 60 футов, до конца вашего следующего хода. Кто начинает ход в облаке, получает 2к6 урона огнём и 2к6 ядом и отравлен до конца хода; спасбросок Телосложения — половина урона и без отравления. Пока облако висит, ваш урон огнём по отравленной цели — ещё 1к6 ядом. Только в бою.
