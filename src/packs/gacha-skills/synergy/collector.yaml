id: rZyBq4yB2CuQfBJT
name: Коллекционер
rarity: blue
tags:
  - аномалия
description: За каждые 3 уникальных тега среди ваших экипированных навыков вы получаете +1 к броскам атаки. Бонус пересчитывается автоматически.
memory_scaling:
  count: equipped_tags
  every: 3
  text: +{n} к броскам атаки.
  changes:
    - key: system.bonuses.mwak.attack
      mode: add
      value: '+{n}'
    - key: system.bonuses.rwak.attack
      mode: add
      value: '+{n}'
    - key: system.bonuses.msak.attack
      mode: add
      value: '+{n}'
    - key: system.bonuses.rsak.attack
      mode: add
      value: '+{n}'
