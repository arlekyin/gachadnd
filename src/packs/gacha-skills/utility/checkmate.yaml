id: knvHRyFZXZPnatYV
name: Шах и мат
rarity: red
tags:
  - разум
description: |-
  Действием призовите в свободную клетку в пределах 30 футов одну шахматную фигуру. Каждую фигуру можно призвать не больше одного раза за бой; на поле могут стоять все три. Фигура маленькая, КД 13, ПЗ — 5 + ваш уровень. Она не атакует и действует только ходом: бонусным действием вы передвигаете одну фигуру. Фигура пропадает на 0 ПЗ или в конце боя.

  Конь ходит буквой «Г» — на две клетки по прямой и одну в сторону, перепрыгивая через всё. Если он встаёт на клетку врага, тот совершает спасбросок Телосложения. При провале враг Опутан: придавлен конём и повторяет спасбросок в конце каждого своего хода. При успехе враг отталкивается на 5 футов в сторону, противоположную коню.

  Ладья ходит по прямой до 30 футов. Каждый союзник, через клетку которого она проходит, восстанавливает 1d8 + ваш бонус мастерства ПЗ и благословлён до конца своего следующего хода: прибавляет 1d4 к броскам атаки и спасброскам.

  Слон ходит по диагонали до 30 футов. Каждый враг, через клетку которого он проходит, получает 2d6 урона психической энергией и совершает спасбросок Мудрости. При провале до конца своего следующего хода он вычитает 1d4 из бросков атаки и спасбросков.

  Спасброски — против универсальной Сложности.
activation: action
range: 30
