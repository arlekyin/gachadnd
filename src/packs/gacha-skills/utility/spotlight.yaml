description: |-
  Бонусным действием погасите свет на поле боя: всё погружается в темноту, а сверху бьёт прожектор на существо в пределах 60 футов, которое вы видите, или на вас. Спотлайт горит до конца следующего раунда. Бонусным действием в свой ход можно перевести луч на другое существо.

  Звезда — тот, кто в луче. Враги видят только звезду: атаковать они могут лишь её или существо, которое стоит вплотную к ним.

  Массовка — ваши союзники в темноте. Их атаки совершаются с преимуществом. Вместо своего действия союзник может подыграть: звезда сразу совершает одно действие сверх своих.

  Пока у вас экипировано 4 навыка с тегом «свет» и больше, лучей два — и звёзд две.
