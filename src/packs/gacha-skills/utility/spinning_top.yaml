name: Волчок
rarity: gray
tags:
  - разум
description: |-
  Действием запустите волчок на любой ровной поверхности. Он кружится 6 секунд — до начала вашего следующего хода. Никто не может с ним взаимодействовать: ни остановить, ни сбить, ни поднять.

  Когда время выходит, что-то отвлекает каждого, кто видел волчок, даже краем глаза: окрик, вспышка, упавший предмет, внезапная мысль. Что именно — описывает Мастер. Когда все снова смотрят туда, волчка нет.

  Никто — ни вы, ни Мастер — так и не узнает, упал ли он. Возможно, он всё ещё крутится где-то ещё.
