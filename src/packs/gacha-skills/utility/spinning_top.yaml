name: Волчок
rarity: blue
tags:
  - разум
description: |-
  Действием запустите волчок на ровной поверхности в пределах 5 футов. Он кружится до начала вашего следующего хода, и все, кто его видит, невольно следят за ним. Враг может действием сбить волчок — тогда ничего не происходит.

  Когда волчок падает, реальность на миг сбивается: каждое существо, которое видело волчок в этот момент, теряет вас из виду. До конца вашего следующего хода вы для него невидимы. Невидимость для существа заканчивается, если вы атакуете его, накладываете на него заклинание или применяете к нему навык.
activation: action
range: 5
uses: 1
recovery: short
