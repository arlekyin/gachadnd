description: |-
  Действием поверните мир на 90° по часовой стрелке или против неё. Все существа в пределах 20 футов от вас — союзники и враги — поворачиваются вокруг вас вместе с ним и оказываются на новых местах. Спасброска нет: поворачивается реальность, а не они. Это не передвижение и не провоцирует атак.

  Существо остаётся на месте, если его новое место за краем поля, занято тем, кто не поворачивается, или если между вами и ним — или его новым местом — стена.
