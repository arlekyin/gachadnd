description: Действием вы издаёте оглушительный ту'ум. Каждое существо в 15-футовом конусе перед вами совершает спасбросок Силы. При провале существо получает урон Звуком, отбрасывается на 20 футов от вас и сбивается с ног. При успехе — только половину урона и не отбрасывается. Урон — Nd8, где N равно бонусу мастерства + 1 (3d8 на 1-м уровне, 7d8 на 17-м).
