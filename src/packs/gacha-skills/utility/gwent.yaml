name: Сыграем... в гвинт?
rarity: red
tags:
  - разум
description: |-
  У вас колода из 12 карт. В начале боя она тасуется, и вы берёте 3 карты; в начале каждого своего хода добираете руку до трёх. Колода кончилась — сброс тасуется обратно.

  Одну карту за ход можно сыграть бонусным действием:
  Казнь (1) — существо с наибольшими ПЗ в 30 футах получает (бонус мастерства)d8 урона силовым полем; при равенстве — все такие.
  Трескучий мороз (2) — зона 15 футов в пределах 30: враги в ней — скорость вдвое меньше до конца своего следующего хода.
  Непроглядный туман (1) — зона 15 футов в пределах 30 до конца боя: дальнобойные атаки в неё и из неё — с помехой.
  Ясное небо (1) — снимает все зоны погоды.
  Командирский рог (2) — союзник в 30 футах: +1d6 к броскам атаки и урону до конца его следующего хода.
  Чучело (2) — вы и союзник в 30 футах меняетесь местами.
  Шпион (1) — возьмите 2 карты; до конца вашего следующего хода атаки по вам — с преимуществом.
  Медик (1) — верните в руку карту из сброса.
  Ведьмак (1) — ваши атаки до конца этого хода наносят +2d6 урона.
activation: bonus
gwent: true
