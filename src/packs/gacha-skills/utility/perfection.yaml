description: |-
  В каждом бою над вами — огранка из семи штрихов. Каждое действие нового для этого боя вида зажигает штрих: удар оружием, заклинание, навык Памяти, манёвр (Рывок, Отход или Уклонение), помощь союзнику (действие Помощь, лечение, защита), приём (толчок, захват, обезоруживание, подножка) или окружение (предмет, зелье, бочка, рычаг, дверь). Обычное перемещение штрихом не считается.

  Небрежно. Закончили ход, не зажёгши ни одного штриха, — последний зажжённый гаснет. Если вы не могли действовать, штрих не гаснет.

  Почти. Пока горят пять штрихов и больше — +1 к броскам атаки, проверкам и спасброскам.

  Само совершенство. Все семь — до конца вашего следующего хода ваши к20 не опускаются ниже 10. Потом огранка гаснет целиком, и всё по новой.

  Удар, заклинание, навык Памяти, зелье и лечение союзника модуль отмечает сам; остальное — кнопкой: используйте навык, чтобы открыть огранку.
activation: special
living: perfection
explicit_name: Давай по новой Миша, всё хуйня
