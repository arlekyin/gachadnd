id: XmwVvRgXiWyQqfSU
name: Тетрис
rarity: red
tags:
  - щит
  - разум
description: |-
  Бонусным действием обрушьте собранную фигуру на поле боя: её центр — в пределах 60 футов.

  Фигуру собирают заранее в окне головоломки, в любой момент — в том числе пока ходят другие. Поле 5×5, у каждой строки и столбца число: сколько клеток в нём должно быть занято. Поставить нужно все четыре детали, их можно поворачивать. Пока фигура не собрана, навык открывает головоломку и заряд не тратится. После обрушения выдаётся новая головоломка.

  Каждая клетка фигуры становится кристаллическим блоком до конца боя: труднопроходимая местность и полуукрытие. Существо, на которое упал блок, выталкивается в ближайшую свободную клетку и совершает спасбросок Ловкости. При провале оно получает дробящий урон: {damage}.

  На поле не больше двух ваших фигур: третья осыпает самую старую. Спасбросок — против универсальной Сложности.
activation: bonus
range: 60
uses: 3
