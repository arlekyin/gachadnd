description: |-
  У вас всегда есть очередь фигур: «Следующая» и «Запас». Обе видны заранее; поменять их местами можно в любой момент, хода это не требует.

  Бонусным действием обрушьте «Следующую» на поле боя: её центр — в пределах 60 футов, все четыре клетки свободны от существ и блоков. Клетки фигуры становятся блоками до конца боя: труднопроходимая местность и полуукрытие. После обрушения из очереди приходит новая фигура.

  Детонация. Группа — всё, что связано с новой фигурой по сторонам клеток (не по диагонали): блоки и существа, которые к ним примыкают, и так дальше по цепочке. Если в группе два врага или больше, она детонирует: её блоки исчезают, а каждый враг в ней совершает спасбросок Ловкости. При провале он получает {damage}, при успехе — половину. Союзники связывают группу, но не считаются и урона не получают.

  Спасбросок — против универсальной Сложности.
