description: |-
  У вас всегда есть очередь фигур: «Следующая» и «Запас». Обе видны заранее; поменять их местами можно в любой момент, хода это не требует.

  Бонусным действием обрушьте «Следующую» на поле боя: её центр — в пределах 60 футов. Четыре клетки фигуры становятся блоками до конца боя: труднопроходимая местность и полуукрытие. Существо, на которое упал блок, выталкивается в ближайшую свободную клетку. После обрушения из очереди приходит новая фигура.

  Линия: когда пять и больше блоков встают подряд по строке или по столбцу, они сгорают. Каждое существо в пределах 5 футов от сгоревшей линии совершает спасбросок Ловкости. При провале оно получает {damage}, при успехе — половину.

  Спасбросок — против универсальной Сложности.
