description: |-
  Вы на мгновение останавливаете время. Реакцией, когда существо, которое вы видите, объявляет атаку, заклинание или умение (до бросков), остановите время — объявленное действие замирает на полпути.

  В остановленном времени вы перемещаетесь в любую точку в пределах 60 футов и переставляете существ и предметы в пределах 60 футов от себя — не больше вашего бонуса мастерства, каждого на расстояние до 30 футов. Застывшие существа не сопротивляются.

  Затем время идёт, и замершее действие завершается против того, что теперь на его пути. Удар или выстрел приходится по тому, кто занял клетку цели, или уходит в пустоту. Область заклинания остаётся на месте — существа в ней уже другие. Ресурс, потраченный на действие, враг теряет в любом случае.
activation: reaction
recovery: long
range: 60
