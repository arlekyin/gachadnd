description: |-
  Действием подвесьте над полем боя диско-шар на 1 минуту или до конца боя. В начале каждого раунда на 6 случайных клетках в пределах 30 футов от шара вспыхивают цветные пятна и горят до конца раунда.

  Существо, которое начинает ход на пятне или впервые за ход заходит на него, тянет карту Чумовой пятницы: случайный баф или дебаф до конца своего следующего хода.
