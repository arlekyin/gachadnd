description: Немедленная эвакуация всей группы — не с этажа, а из боя. Действием в бою отряд покидает текущий узел и возвращается на предыдущий узел карты. Отступление не провоцирует атак. Узел остаётся не пройден — враги сохраняют полученный урон и потраченные ресурсы. Вернуться можно в любой момент.
