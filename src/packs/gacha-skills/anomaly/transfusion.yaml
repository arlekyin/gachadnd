description: |-
  Действием выберите существо в пределах 30 футов. Вы меняетесь с ним долями оставшихся ПЗ: каждый получает текущие ПЗ, равные доле своего максимума, которая была у другого (округление вниз, не меньше 1). У вас было 10 %, у врага 90 % — теперь наоборот.

  Существо, которое не согласно на обмен, совершает спасбросок Телосложения против универсальной Сложности; при успехе обмена нет, а заряд потрачен.
drawback: После обмена вы получаете 1 степень истощения.
