name: Счётчик ауры
rarity: red
tags:
  - разум
description: |-
  Бонусным действием в бою включите ауру. Она горит минуту (10 раундов) или до конца боя и растёт от 0 до 5; при включении — 1. Шкала и кнопки — в панели ауры (повторное использование навыка открывает её).

  Позёрство. Раз в раунд перед броском к20 — атакой, проверкой или спасброском — объявите трюк: опишите, как это выглядит, и выберите цену. Бросок удался — аура растёт, провалился — падает. Небрежно (помеха): +1 / −1. Одной левой (−5 к броску): +1 / −1. Открыться (КД −2 до начала вашего следующего хода, бросок обычный): +1 / без потерь. Ва-банк (помеха и КД −2): +2 / −2. Если сложность броска неизвестна, итог решает Мастер кнопкой на карточке в чате.

  Критическое попадание и добивание врага в ваш ход — +1, натуральная 1 — −1. Если с начала вашего прошлого хода вы не получили ауры, в начале хода она уменьшается на 1. На 0 навык гаснет.

  Пороги. 2 — Уверенность: +1 к броскам атаки и проверкам Запугивания. 4 — Давление: враги в 10 футах от вас совершают спасброски с помехой. 5 — Главный герой: враг, начинающий ход в 15 футах от вас, совершает спасбросок Мудрости (Сл 8 + бонус мастерства + модификатор Харизмы); провал — испуган до конца своего хода. Пока аура на максимуме, звучит тема героя, а от вас расходятся волны.

  Не в этой арке. Когда вы получаете урон при ауре 3 и больше, можете потратить всю ауру: урон не проходит, навык гаснет.
