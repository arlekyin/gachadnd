description: |-
  Бонусным действием начните шипеть — враги видят и слышат это. Если в конце вашего следующего хода в 5 футах от вас есть враг, вы взрываетесь: каждое существо в 10 футах совершает спасбросок Ловкости и получает {damage}, при успехе — половину. Вы получаете половину этого урона без спасброска.

  Если к концу следующего хода рядом с вами никого нет, взрыва не будет, а заряд вернётся.
