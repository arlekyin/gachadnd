description: |-
  Когда выпадают кристаллы, вы можете поставить на кон любое количество кристаллов из инвентаря (минимальная ставка — 1 Зелёный или 1 Синий кристалл). За каждый поставленный кристалл бросьте {roll}:

  01–10: Всё сгорело! Казино всегда в плюсе — кристалл уничтожается.
  11–35: Выиграл жевательную резинку — кристалл заменяется на случайный Серый.
  36–70: Отбился — заменяется на случайный Зелёный.
  71–90: Крупный куш! — заменяется на случайный Синий.
  91–99: ДЖЕКПОТ! — заменяется на случайный Фиолетовый.
  100: АБСОЛЮТНЫЙ ДЖЕКПОТ! — выпадают 2 Красных кристалла.

  Замену проводит Мастер.
