name: Чумовая пятница
rarity: red
tags:
  - разум
description: |-
  Действием перепутайте всех в бою: каждое существо, у которого больше 0 ПЗ, — союзник, враг и вы сами — оказывается на месте случайного другого участника, какого бы размера они ни были. Кто окажется рядом с кем, не знает никто.

  Если крупное существо встало туда, где кто-то оказался, оно его придавило: придавленный выталкивается в ближайшую свободную клетку и получает [[/damage 2d6 bludgeoning]]. Крупные встают первыми — давит больший.

  Каждый участник тянет карту — до конца своего следующего хода. Вы всегда тянете удачную, остальным — как повезёт. Удачные: невидимость, скорость ×2, 2d8 временных ПЗ, +2 к атакам, +2 к КД, сопротивление всему урону. Неудачные: сбит с ног, отравлен, опутан, ослеплён, скорость 0, −2 к КД.

  Очередь тоже путается: значения инициативы у тех, кто ещё не ходил в этом раунде, перемешиваются между ними.

  Это не передвижение: атак по возможности нет. Спасброска нет.
activation: action
uses: 1
recovery: long
freaky: true
