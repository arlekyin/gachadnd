description: |-
  Действием раскройте территорию — неподвижную сферу радиусом 30 футов с центром на вас. Территория держится, пока вы её поддерживаете, но не дольше 1 минуты. Свернуть её можно в любой момент без действия.

  Гарантированное попадание. Внутри сферы ваши атаки автоматически попадают по всем целям. Критическое попадание — только при выпавшей 20. Спасброски территория не затрагивает.

  Территория отражает характер владельца: у каждого персонажа свой личный эффект.
drawback: 'Поддержание: в начале каждого вашего хода после раскрытия вы теряете количество ПЗ, равное вашему уровню × число ваших ходов, прошедших с раскрытия. Временные ПЗ и сопротивления эту потерю не уменьшают. Если потеря опустила бы ваши ПЗ до 0, территория рушится, а вы падаете без сознания с 0 ПЗ.'
activation: action
recovery: long
personal: true
