name: Утечка газа
rarity: purple
tags:
  - взрыв
  - яд
description: |-
  Действием откройте вентиль в точке в пределах 60 футов. Невидимое облако газа радиусом 10 футов в начале каждого раунда растёт на 5 футов, до 30. Существо, которое начинает ход в газе, совершает спасбросок Телосложения; провал — Отравлен до конца хода.

  Любой урон огнём в облаке или огонь в нём поджигает газ: каждое существо в облаке совершает спасбросок Ловкости и получает 1d6 урона огнём за каждые 5 футов радиуса облака, при успехе — половину. Облако выгорает.
activation: action
range: 60
uses: 1
recovery: long
blast: gas
