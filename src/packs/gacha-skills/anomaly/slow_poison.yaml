description: |-
  Бонусным действием отметьте существо в пределах 60 футов. Яд действует не сразу: отметка считает весь урон, который существо получает от кого угодно в течение 3 раундов.

  В конце третьего раунда яд срабатывает — существо получает урон Ядом, равный всему подсчитанному. Чем дружнее отряд бьёт отмеченного, тем страшнее финал. Если существо умерло раньше, яд пропадает.
