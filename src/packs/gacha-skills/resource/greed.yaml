description: Каждый раз, когда Мастер генерирует добычу за боевую сцену, вы дополнительно получаете 2 случайных кристалла по правилам этой добычи. Они сразу поглощаются в Память — без выбора.
drawback: Отказаться от кристаллов Жадности нельзя. При переполнении Памяти сгорает случайный неэкипированный навык. Повтор навыка повышает его ранг, а повтор навыка на максимальном ранге сгорает.
