id: fTuOgJRGCIp8H5Ja
name: Фотосинтез
rarity: gray
tags:
  - свет
description: Завершив короткий отдых на свету, активируйте навык и восстановите сверх обычного отдыха количество ПЗ, равное {damage}.
activation: special
uses: 1
recovery: short
damage:
  - formula: 1d6 + @prof
    type: healing
ranks:
  - text: Восстанавливает 2d6 + бонус мастерства ПЗ.
    damage:
      - formula: 2d6 + @prof
        type: healing
  - text: Восстанавливает Nd6 + бонус мастерства ПЗ, где N — ваш бонус мастерства.
    damage:
      - formula: (@prof)d6 + @prof
        type: healing
