id: FyxfKqQkqtsGHzu2
name: Симбионт
rarity: blue
tags:
  - кровь
  - проклятье
description: В начале каждого своего хода в бою активируйте навык и восстановите количество ПЗ, равное {damage}.
drawback: Если в начале хода ваши ПЗ ниже половины максимума, совершите спасбросок Мудрости СЛ 12. При провале вы впадаете в ярость и атакуете ближайшее существо.
activation: turnStart
damage:
  - formula: "@prof"
    type: healing
ranks:
  - text: Восстанавливает бонус мастерства + модификатор Телосложения (не меньше 0) ПЗ.
    damage:
      - formula: "@prof + max(@abilities.con.mod, 0)"
        type: healing
  - text: Восстанавливает 2 × бонус мастерства + модификатор Телосложения (не меньше 0) ПЗ.
    damage:
      - formula: "2 * @prof + max(@abilities.con.mod, 0)"
        type: healing
