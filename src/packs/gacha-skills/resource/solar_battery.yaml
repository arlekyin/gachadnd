description: |-
  Закончив ход на ярком свету, батарея получает 1 заряд; больше бонуса мастерства она не копит. Заряды не пропадают на отдыхе.

  В свой ход потратьте 3 заряда батареи, чтобы восстановить 1 заряд другого экипированного навыка. Подзарядка греет навык (см. «Перегрев»).
