id: cTzZOAyFpiAmR2S9
name: Флэш
rarity: red
tags:
  - движение
description: |-
  Ваша скорость удваивается, а перемещение не провоцирует атак. Вы можете бегать по стенам, потолку и воде, если заканчиваете ход на твёрдой опоре. В бою вы всегда ходите первым.

  Сила скорости: бонусным действием ускорьтесь до конца боя. Вы получаете +2 к КД, совершаете спасброски Ловкости с преимуществом, а в каждый свой ход — одно дополнительное действие, которым можно только совершить одну атаку оружием, Рывок, Отход, Засаду или Использовать предмет. Концентрация не требуется.
activation: bonus
uses: 1
recovery: long
changes:
