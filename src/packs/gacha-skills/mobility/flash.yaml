name: Флэш
rarity: red
tags:
  - движение
description: |-
  Вы живёте быстрее остальных. В каждом раунде боя вы совершаете два хода: первый — на своей инициативе, второй — на инициативе на 10 меньше (Мастер добавляет вас в трекер боя второй раз).

  В каждом из этих ходов у вас есть перемещение и либо действие, либо бонусное действие — не оба сразу. Реакция — одна на раунд.
activation: none
