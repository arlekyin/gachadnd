name: Портал
rarity: purple
tags:
  - движение
description: |-
  Бонусным действием выстрелите из портальной пушки в свободную клетку в пределах 60 футов: там открывается синий или оранжевый портал. Новый портал заменяет ваш прежний того же цвета. Порталы держатся до конца боя.

  Существо — союзник или враг, — которое заканчивает перемещение в клетке одного портала, выходит из другого в следующую клетку по направлению своего движения; если она занята — в ближайшую свободную. Если портал открыт только один, он никуда не ведёт.

  Что быстро входит, то быстро выходит: существо, которое толкнули в портал, вылетает из другого и пролетает оставшееся расстояние. Дальнобойную атаку или луч можно направить в портал: дальность считается до входа и дальше от выхода.
activation: bonus
range: 60
portal: true
