description: |-
  Бонусным действием станьте бесплотным до конца хода. Вы проходите сквозь существ и предметы — в том числе стены — как через труднопроходимую местность, атаки по вам совершаются с помехой, и вас нельзя схватить или опутать.

  Если ход заканчивается, пока вы внутри предмета, вас выталкивает в ближайшее свободное пространство, и вы получаете 1d10 урона силовым полем за каждые 5 футов выталкивания.
activation: bonus
uses: 1
recovery: short
