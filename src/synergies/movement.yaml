tag: движение
key: movement
icon: icons/svg/wing.svg
tiers:
  - count: 2
    name: Стремительность
    description: Ваша скорость ходьбы увеличивается на 10 футов. Действует автоматически.
    changes:
      - { key: system.attributes.movement.walk, mode: add, value: '+10' }
  - count: 4
    name: Неуловимость
    description: Ваше перемещение не провоцирует атак. Вы можете проходить сквозь пространство враждебных существ, но не можете заканчивать в нём ход.
  - count: 6
    name: Неостановимая сила
    description: 1 раз в ход, если перед попаданием атакой вы переместились по прямой не меньше чем на 20 футов, атака наносит дополнительно 1d8 урона силовым полем за каждые 10 футов этого пути. Цель совершает спасбросок Силы против универсальной Сложности, при провале её отталкивает на 10 футов и сбивает с ног.
