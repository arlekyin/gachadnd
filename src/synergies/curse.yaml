tag: проклятье
key: curse
icon: icons/svg/skull.svg
tiers:
  - count: 2
    name: Сделка с Бездной
    description: В начале своего хода вы можете получить урон некротической энергией, равный бонусу мастерства; этот урон нельзя уменьшить или предотвратить. Тогда до конца хода вы совершаете броски атаки с преимуществом.
    trigger:
      on: turn_start
      pay: { formula: '@prof', type: necrotic }
      advantage: attacks
  - count: 4
    name: Кровавый щит
    description: Реакцией, когда вы получаете урон от атаки или заклинания врага, уменьшите этот урон на 1d10 + ваш уровень. Количество использований равно бонусу мастерства, они восстанавливаются после долгого отдыха.
    trigger:
      on: damaged
      reduce: { formula: 1d10 + @details.level }
    feature:
      activation: reaction
      uses: prof
      recovery: long
      roll: { formula: 1d10 + @details.level, name: Уменьшение урона }
  - count: 6
    name: Аватар Скверны
    description: 1 раз до долгого отдыха бонусным действием примите облик Аватара на 1 минуту. Вы получаете сопротивление всем видам урона, кроме урона психической энергией и излучением. 1 раз в ход ваша атака ближнего боя или заклинание наносит дополнительный урон некротической энергией, равный количеству потерянных вами ПЗ, но не больше 30. Когда облик заканчивается, вы получаете 1 уровень Истощения.
    feature:
      activation: bonus
      uses: 1
      recovery: long
