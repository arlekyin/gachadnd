tag: щит
key: shield
icon: icons/svg/aura.svg
tiers:
  - count: 2
    name: Бастион
    description: В начале каждого боя вы получаете временные ПЗ в количестве, равном 5 × бонус мастерства.
  - count: 4
    name: Адаптивный барьер
    description: Реакцией, когда вы получаете урон, получите сопротивление этому виду урона до начала своего следующего хода. Сопротивление действует и на урон, вызвавший реакцию.
  - count: 6
    name: Эгида
    description: 1 раз до долгого отдыха бонусным действием создайте ауру радиусом 30 футов на 1 минуту. Вы получаете временные ПЗ в количестве, равном 10 × бонус мастерства. Союзники в ауре получают сопротивление всем видам урона; каждый раз, когда союзник получает урон, уменьшенный этим сопротивлением, вы получаете столько же урона силовым полем, и его нельзя уменьшить. Ауру можно развеять досрочно без действия.
    feature:
      activation: bonus
      uses: 1
      recovery: long
      target: { type: radius, value: 30 }
      heal: { formula: 10 * @prof, type: temphp }
