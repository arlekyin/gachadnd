tag: казнь
key: execution
icon: icons/svg/sword.svg
tiers:
  - count: 2
    name: Кровавый след
    description: 1 раз в ход, когда вы попадаете атакой или наносите урон заклинанием существу, у которого меньше половины максимума ПЗ, оно получает дополнительно 1d6 урона некротической энергией.
    trigger:
      on: damage_roll
      when: [target_bloodied]
      bonus: { formula: 1d6, type: necrotic }
  - count: 4
    name: Гильотина
    description: Если ваш урон опускает ПЗ врага до значения, равного 10 + ваш уровень, или ниже, враг погибает. Боссы и существа с легендарными действиями не погибают от Гильотины. Когда враг погибает так, остальные враги в пределах 15 футов совершают спасбросок Мудрости против универсальной Сложности, при провале они Испуганы до конца своего следующего хода.
  - count: 6
    name: Резня
    description: 1 раз за бой, когда вы убиваете врага с показателем опасности 1/4 или выше, вы сразу получаете одно дополнительное действие.
    trigger:
      on: kill
      min_cr: 0.25
    feature:
      activation: special
      uses: 1
      recovery: combat
