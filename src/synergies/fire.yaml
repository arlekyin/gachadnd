tag: огонь
key: fire
icon: icons/svg/fire.svg
tiers:
  - count: 2
    name: Воспламенение
    description: 1 раз в ход ваша атака или заклинание наносит дополнительно 1d6 урона огнём и поджигает цель. Горящая цель в начале своего хода получает урон огнём, равный вашему бонусу мастерства. Действием она может потушить себя. Повторный поджог не складывается — цель просто горит дальше. Это пламя не перекидывается на предметы и других существ.
  - count: 4
    name: Испепеление
    description: Ваш урон огнём игнорирует сопротивление огню; существа с иммунитетом к огню получают от него половину урона. Пока враг горит от вашего Воспламенения, его КД ниже на 2.
  - count: 6
    name: Огненный шторм
    description: 1 раз за бой бонусным действием раздуйте пламя. Каждый горящий от вашего Воспламенения враг совершает спасбросок Ловкости против универсальной Сложности. При провале он получает 6d6 урона огнём, и загораются все враги в пределах 10 футов от него; при успехе — половину урона, огонь не перекидывается.
    feature:
      activation: bonus
      uses: 1
      recovery: combat
      save: { ability: dex, on_save: half }
      damage: [{ formula: 6d6, type: fire }]
