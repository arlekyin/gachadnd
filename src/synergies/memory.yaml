tag: память
key: memory
icon: icons/svg/book.svg
tiers:
  - count: 2
    name: Оперативный кэш
    description: В первом раунде боя вы можете один раз использовать навык из Памяти, требующий действия, бонусным действием.
  - count: 4
    name: Параллельные вычисления
    description: 1 раз в раунд, если в этот ход вы совершили атаку или наложили заклинание, вы можете бонусным действием использовать экипированный навык, требующий действия.
  - count: 6
    name: Эхо-протокол
    description: 1 раз до долгого отдыха, используя навык из Памяти, вы можете заставить его эффект сработать дважды подряд. Заряды и прочие ресурсы тратятся один раз.
    feature:
      activation: special
      uses: 1
      recovery: long
