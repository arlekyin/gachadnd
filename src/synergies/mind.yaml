tag: разум
key: mind
icon: icons/svg/eye.svg
tiers:
  - count: 2
    name: Ясность мысли
    description: Сложность спасбросков от ваших заклинаний, навыков из Памяти и синергий выше на 1. Вы получаете сопротивление урону психической энергией. Действует автоматически.
    changes:
      - { key: system.traits.dr.value, mode: add, value: psychic }
      - { key: system.bonuses.spell.dc, mode: add, value: '+1' }
  - count: 4
    name: Ментальное давление
    description: Реакцией, когда существо преуспевает в спасброске от вашего эффекта, заставьте его перебросить к20 и использовать новый результат. Количество использований равно бонусу мастерства, они восстанавливаются после долгого отдыха.
    feature:
      activation: reaction
      uses: prof
      recovery: long
  - count: 6
    name: Абсолютная доминация
    description: 1 раз до долгого отдыха действием подчините себе существо в пределах 60 футов на 1 минуту, концентрация не требуется. Цель совершает спасбросок Интеллекта против универсальной Сложности; каждый раз, когда цель получает урон, она повторяет спасбросок и при успехе освобождается. Существа с легендарными сопротивлениями не подчиняются, а вместо этого получают 8d10 урона психической энергией.
    feature:
      activation: action
      uses: 1
      recovery: long
      range: 60
      save: { ability: int, on_save: none }
      damage: [{ formula: 8d10, type: psychic }]
