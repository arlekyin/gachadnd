tag: яд
key: poison
icon: icons/svg/acid.svg
tiers:
  - count: 2
    name: Токсичная кромка
    description: 1 раз в ход, когда вы попадаете атакой или наносите урон заклинанием, цель получает дополнительно 1d6 урона ядом.
  - count: 4
    name: Коррозия
    description: Ваш урон ядом игнорирует сопротивление яду; существа с иммунитетом к яду получают от него половину урона.
  - count: 6
    name: Нейротоксин
    description: Существо, получившее от вас урон ядом, совершает спасбросок Телосложения против универсальной Сложности. При провале оно Отравлено до конца вашего следующего хода и вычитает 1d4 из своих бросков атаки и спасбросков, пока отравлено так. Иммунитет к состоянию «Отравленный» защищает от Нейротоксина.
