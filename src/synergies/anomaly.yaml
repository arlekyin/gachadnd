tag: аномалия
key: anomaly
icon: icons/svg/target.svg
tiers:
  - count: 2
    name: Сдвиг фазы
    description: Ваши дальнобойные атаки и заклинания игнорируют укрытие на половину. Досягаемость ваших атак ближнего боя увеличивается на 5 футов.
  - count: 4
    name: Мерцание
    description: Бонусным действием телепортируйтесь на расстояние до 15 футов в свободное пространство, которое видите. Количество использований равно бонусу мастерства, они восстанавливаются после короткого или долгого отдыха.
    feature:
      activation: bonus
      uses: prof
      recovery: short
      range: 15
  - count: 6
    name: Квантовая запутанность
    description: Реакцией, когда по вам попадает атака или вы получаете урон от заклинания, поменяйтесь местами с существом в пределах 30 футов, которое видите и которое не является источником урона. Согласный союзник меняется местами сразу; враг совершает спасбросок Харизмы против универсальной Сложности. Если обмен произошёл, это существо получает урон и эффекты вместо вас; при успешном спасброске врага вы остаётесь на месте и получаете урон сами. 1 раз за бой.
    feature:
      activation: reaction
      uses: 1
      recovery: combat
      range: 30
      save: { ability: cha }
