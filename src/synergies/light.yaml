tag: свет
key: light
icon: icons/svg/sun.svg
tiers:
  - count: 2
    name: Светоч
    description: Вы излучаете тусклый свет в радиусе 10 футов. В бою в начале каждого своего хода, если у вас есть хотя бы 1 ПЗ, вы восстанавливаете количество ПЗ, равное бонусу мастерства.
  - count: 4
    name: Очищение
    description: 1 раз за бой бонусным действием снимите с себя или союзника в пределах 30 футов, которого видите, одно состояние — Ослеплённый, Очарованный, Ошеломлённый, Испуганный, Отравленный или Парализованный.
    feature:
      activation: bonus
      uses: 1
      recovery: combat
      range: 30
  - count: 6
    name: Сверхновая
    description: 1 раз до короткого или долгого отдыха бонусным действием создайте ауру радиусом 15 футов на 1 минуту. Враг, начинающий ход в ауре, совершает спасбросок Телосложения против универсальной Сложности, при провале он Ослеплён до конца своего хода. Союзник, начинающий ход в ауре, восстанавливает 1d4 ПЗ.
    feature:
      activation: bonus
      uses: 1
      recovery: short
      target: { type: radius, value: 15 }
      save: { ability: con, on_save: none }
      heal: { formula: 1d4 }
