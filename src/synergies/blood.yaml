tag: кровь
key: blood
icon: icons/svg/blood.svg
tiers:
  - count: 2
    name: Вкус крови
    description: 1 раз в ход, пока ваши ПЗ ниже максимума, ваша атака или заклинание наносит дополнительный урон некротической энергией, равный бонусу мастерства. Если у вас меньше половины максимума ПЗ, урон удваивается.
  - count: 4
    name: Жажда
    description: 1 раз в ход, когда вы наносите урон враждебному существу, вы восстанавливаете количество ПЗ, равное 1d6 + бонус мастерства.
  - count: 6
    name: Кровавый пакт
    description: 1 раз до долгого отдыха, когда ваши ПЗ опускаются до 0, вместо этого у вас остаётся 1 ПЗ и вы восстанавливаете количество ПЗ, равное 3d8 + ваш уровень. Враги в пределах 15 футов совершают спасбросок Телосложения против универсальной Сложности и получают урон некротической энергией, равный этому лечению, или половину при успехе.
    feature:
      activation: special
      uses: 1
      recovery: long
      heal: { formula: 3d8 + @details.level }
      target: { type: radius, value: 15 }
      save: { ability: con, on_save: half }
      damage: [{ formula: 3d8 + @details.level, type: necrotic }]
