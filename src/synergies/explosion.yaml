tag: взрыв
key: explosion
icon: icons/svg/explosion.svg
tiers:
  - count: 2
    name: Осколочный урон
    description: 1 раз в ход, когда вы попадаете атакой или наносите урон заклинанием, вы можете вызвать детонацию — цель и все враги в пределах 5 футов от неё получают 1d6 урона силовым полем.
  - count: 4
    name: Ударная волна
    description: Существа, получившие урон от вашей детонации (Взрыв I), совершают спасбросок Силы против универсальной Сложности. При провале их отталкивает на 10 футов от цели детонации.
  - count: 6
    name: Цепная реакция
    description: Враг, убитый вашей атакой или заклинанием, взрывается — все враги в пределах 10 футов от него получают 3d6 урона силовым полем. Враг, убитый этим взрывом, тоже взрывается. Каждое существо взрывается только один раз.
